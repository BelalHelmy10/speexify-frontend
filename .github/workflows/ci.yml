name: Frontend CI

on:
  push:
    paths:
      - "app/**"
      - "components/**"
      - "hooks/**"
      - "lib/**"
      - "styles/**"
      - "tests/**"
      - "scripts/**"
      - "utils/**"
      - "public/**"
      - "middleware.js"
      - "next.config.mjs"
      - ".eslintrc.json"
      - ".eslintignore"
      - "package.json"
      - "package-lock.json"
      - "playwright.classroom.config.mjs"
      - ".github/workflows/ci.yml"
      - ".github/workflows/classroom-real-devices.yml"
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "hooks/**"
      - "lib/**"
      - "styles/**"
      - "tests/**"
      - "scripts/**"
      - "utils/**"
      - "public/**"
      - "middleware.js"
      - "next.config.mjs"
      - ".eslintrc.json"
      - ".eslintignore"
      - "package.json"
      - "package-lock.json"
      - "playwright.classroom.config.mjs"
      - ".github/workflows/ci.yml"
      - ".github/workflows/classroom-real-devices.yml"

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The production build needs these public values. The CI build is never
    # deployed (Vercel builds with its own settings): repository variables win
    # when set; otherwise a well-formed Google stand-in (next.config.mjs
    # refuses an empty one) and the public Sanity project the site reads.
    env:
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID || '000000000000-ci-build.apps.googleusercontent.com' }}
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID || 'rdg57gpl' }}
      NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET || 'production' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (strict)
        run: npm run lint

      - name: Type generation
        run: npm run typecheck

      - name: Production build
        run: npm run build

  classroom-browser-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Classroom browser and device matrix
        run: npm run qa:classroom:browsers
        env:
          TURN_URL: ${{ secrets.TURN_URL }}
          TURN_USERNAME: ${{ secrets.TURN_USERNAME }}
          TURN_CREDENTIAL: ${{ secrets.TURN_CREDENTIAL }}

      - name: Upload classroom diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classroom-playwright-${{ github.run_id }}
          path: |
            playwright-report/classroom
            test-results/classroom
          if-no-files-found: ignore
          retention-days: 14
