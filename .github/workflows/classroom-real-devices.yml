name: Classroom Real Devices

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * 1-5"

concurrency:
  group: classroom-real-devices
  cancel-in-progress: true

jobs:
  browserstack-smoke:
    # BrowserStack is not set up yet, so the nightly run failed (and emailed)
    # every weekday. It runs on schedule once the repository variable
    # CLASSROOM_REAL_DEVICES_ENABLED is "1"; a manual run always runs and
    # still fails loudly if the credentials are missing.
    if: github.event_name == 'workflow_dispatch' || vars.CLASSROOM_REAL_DEVICES_ENABLED == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      CLASSROOM_SMOKE_URL: ${{ secrets.CLASSROOM_SMOKE_URL }}
      CLASSROOM_SMOKE_COOKIES_JSON: ${{ secrets.CLASSROOM_SMOKE_COOKIES_JSON }}
      CLASSROOM_REAL_DEVICE_JOIN: ${{ vars.CLASSROOM_REAL_DEVICE_JOIN || '1' }}
      BROWSERSTACK_BUILD_NAME: classroom-${{ github.run_id }}

    steps:
      - name: Check real-device configuration
        run: |
          missing=0
          for name in BROWSERSTACK_USERNAME BROWSERSTACK_ACCESS_KEY CLASSROOM_SMOKE_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is required; physical-device coverage has not been verified."
              missing=1
            fi
          done
          exit "$missing"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: iPhone, iPad, Pixel, and Android tablet smoke tests
        run: npm run qa:classroom:real-devices

      - name: Upload real-device screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classroom-real-devices-${{ github.run_id }}
          path: test-results/classroom-real-devices
          if-no-files-found: ignore
          retention-days: 14
